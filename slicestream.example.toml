[storage]
root = "storage"                 # tmp/, objects/, index.sqlite live here
max_instance_bytes = 2147483648  # 2 GiB
on_duplicate = "keep"            # keep | overwrite

[http]
addr = "127.0.0.1:8080"
max_request_bytes = 17179869184  # 16 GiB
# stow_token = "..."
cors_allowed_origins = []        # e.g. ["https://viewer.example.org"]; empty: no CORS
allowed_hosts = []               # empty: localhost, 127.0.0.1, [::1], addr's host
metrics_enabled = true           # GET /api/metrics, /api/metrics/history, /api/console/series
# public_url = "https://pacs.example.org"  # base of Retrieve URLs and BulkDataURIs; default http://<Host>

[dimse]
enabled = true
ae_title = "SLICESTREAM"
addr = "0.0.0.0:11112"
require_called_ae_title = true
allowed_peers = []               # e.g. ["CT01", "MR02"]
max_associations = 64
max_pdu_length = 116794
read_timeout_secs = 60
write_timeout_secs = 60
handshake_timeout_secs = 30      # TCP accept -> association established
idle_timeout_secs = 300          # abort when no DIMSE command arrives

# Archive and NIfTI uploads: POST /api/archives (ZIP, 7z, RAR, tar, tar.gz,
# .nii/.nii.gz or a single DICOM file), progress at GET /api/archives/{job}.
# Same token as STOW ([http] stow_token); the body is capped by
# [http] max_request_bytes. Exceeding max_entries or max_expanded_bytes
# aborts the upload (items already stored stay stored).
[archives]
enabled = true                      # false: both archive routes are not mounted
max_depth = 4                       # nesting levels below the uploaded file
max_entries = 200000                # files seen across the whole upload
max_expanded_bytes = 68719476736    # 64 GiB of decompressed data per upload
min_free_bytes = 2147483648         # keep 2 GiB free: refuse (507) or abort below it
max_concurrent_jobs = 2             # further uploads wait (queue cap: 4x this)
job_retention = 50                  # finished jobs kept in memory for the API
body_idle_timeout_secs = 60         # a body silent this long is refused (408)

[dicomweb]
enabled = true        # false: the /dicom-web GET routes are not mounted (STOW-RS stays)
max_results = 1000    # QIDO limit: default and maximum
