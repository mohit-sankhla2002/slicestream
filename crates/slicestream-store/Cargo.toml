[package]
name = "slicestream-store"
description = "Durable spooling and content-addressed blob storage for slicestream."
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
dicom-core = "0.10.1"
dicom-dictionary-std = { version = "0.10.1", features = ["sop-class"] }
dicom-encoding = "0.10.1"
dicom-object = "0.10.1"
dicom-parser = "0.10.1"
dicom-transfer-syntax-registry = "0.10.1"
fs4 = "1.1.0"
rand = "0.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
slicestream-core = { version = "0.1.0", path = "../slicestream-core" }
slicestream-codec = { version = "0.1.0", path = "../slicestream-codec" }
slicestream-dicomweb = { version = "0.1.0", path = "../slicestream-dicomweb" }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1", features = ["fs", "io-util", "rt", "sync"] }
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt", "rt-multi-thread"] }
