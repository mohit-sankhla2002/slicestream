[package]
name = "slicestream-server"
description = "Reference HTTP + WebSocket server that streams DICOM slices to browsers in scroll order."
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
slicestream-core = { path = "../slicestream-core", version = "0.1.0" }
slicestream-store = { path = "../slicestream-store", version = "0.1.0" }
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3.34"
mime = "0.3.18"
multer = "3.1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["full"] }
tower = { version = "0.5.3", default-features = false }
tower-http = { version = "0.7.1", features = ["fs", "cors"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
clap = { version = "4.6.7", features = ["derive"] }
toml = "1.2.1"
tokio-util = "0.7.20"
slicestream-dimse = { version = "0.1.0", path = "../slicestream-dimse" }

[dev-dependencies]
dicom-core = "0.10.1"
dicom-dictionary-std = "0.10.1"
dicom-object = "0.10.1"
dicom-transfer-syntax-registry = "0.10.1"
dicom-ul = { version = "0.10.1", features = ["async"] }
http-body-util = "0.1.5"
tempfile = "3"
tokio-tungstenite = "0.29.0"
tower = { version = "0.5.3", features = ["util"] }
