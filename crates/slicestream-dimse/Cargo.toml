[package]
name = "slicestream-dimse"
description = "DIMSE C-STORE/C-ECHO storage SCP for slicestream."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
dicom-core = "0.10.1"
dicom-dictionary-std = { version = "0.10.1", features = ["sop-class"] }
dicom-object = "0.10.1"
dicom-transfer-syntax-registry = "0.10.1"
dicom-ul = { version = "0.10.1", features = ["async"] }
serde = { version = "1.0.229", features = ["derive"] }
slicestream-store = { version = "0.1.0", path = "../slicestream-store" }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "net", "rt", "sync", "time"] }
tokio-util = "0.7.20"
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.54.1", features = ["macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
