name: CI
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
      # The archive crate without RAR (UnRAR is not OSI-licensed).
      - run: cargo test -p slicestream-archive --no-default-features
      - run: cargo clippy -p slicestream-archive --no-default-features --all-targets -- -D warnings
      # Corrupted 7z/RAR inputs (slow in debug, so release and opt-in).
      - run: cargo test --release -p slicestream-archive --test mutate_7z_rar -- --ignored
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test 'web/tests/*.test.js'

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --locked

  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y dcmtk
      - run: bash scripts/interop-dcmtk.sh
